name: Auto Update 13F Data & Deploy

on:
  schedule:
    # Runs at 00:00 UTC on the 16th of Feb, May, Aug, Nov (right after SEC 13F filing deadlines)
    - cron: '0 0 16 2,5,8,11 *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions web tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and process SEC 13F data
        run: node scripts/fetch-sec-data.js

      - name: Commit and push updated data if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): Auto-update quarterly SEC 13F data [skip ci]"
            git push origin main
          fi
